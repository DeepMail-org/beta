syntax = "proto3";

package deepmail.ml;

import "google/protobuf/timestamp.proto";

service MlService {
  rpc ClassifyPhishing   (PhishingRequest)    returns (PhishingResult);
  rpc ClassifyAttachment (AttachmentRequest)  returns (AttachmentResult);
  rpc DetectAnomaly      (AnomalyRequest)     returns (AnomalyResult);
  rpc GetEmbedding       (EmbeddingRequest)   returns (EmbeddingResult);
}

message PhishingRequest {
  string email_id      = 1;
  string subject       = 2;
  string body_plain    = 3;
  string from_address  = 4;
}

message PhishingResult {
  string   email_id              = 1;
  float    phishing_probability  = 2;
  string   label                 = 3;
  float    confidence            = 4;
  string   model_version         = 5;
  repeated string triggered_features = 6;
}

message AttachmentRequest {
  string   attachment_id      = 1;
  float    entropy            = 2;
  repeated string suspicious_strings = 3;
  bool     has_macros         = 4;
  string   file_type          = 5;
  string   imphash            = 6;
}

message AttachmentResult {
  string attachment_id        = 1;
  float  malicious_probability = 2;
  string label                = 3;
  float  confidence           = 4;
}

message AnomalyRequest {
  string email_id      = 1;
  string from_address  = 2;
  string from_domain   = 3;
  string tenant_id     = 4;
  google.protobuf.Timestamp send_time = 5;
  map<string, float> features = 6;
}

message AnomalyResult {
  string   email_id        = 1;
  bool     is_anomalous    = 2;
  float    anomaly_score   = 3;
  repeated string anomaly_reasons = 4;
}

message EmbeddingRequest {
  string email_id = 1;
  string text     = 2;
}

message EmbeddingResult {
  string   email_id      = 1;
  repeated float vector  = 2;
  string   model_version = 3;
}
