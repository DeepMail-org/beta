[package]
name        = "deepmail-sandbox-dynamic"
version.workspace     = true
edition.workspace     = true
authors.workspace     = true
license.workspace     = true
description = "DeepMail service: dynamic analysis sandbox (CAPEv2 orchestrator)"

[[bin]]
name = "deepmail-sandbox-dynamic"
path = "src/main.rs"

[dependencies]
deepmail-common = { path = "../deepmail-common" }

tokio.workspace              = true
tonic.workspace              = true
prost.workspace              = true
sqlx.workspace               = true
async-nats.workspace         = true
serde.workspace              = true
serde_json.workspace         = true
tracing.workspace            = true
tracing-subscriber.workspace = true
thiserror.workspace          = true
anyhow.workspace             = true
uuid.workspace               = true
chrono.workspace             = true
futures.workspace            = true

reqwest = { version = "0.11", features = ["json", "multipart", "rustls-tls"], default-features = false }
once_cell = "1"
regex = "1"
tonic-health = "0.11"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
tokio-stream = { version = "0.1", features = ["net"] }
