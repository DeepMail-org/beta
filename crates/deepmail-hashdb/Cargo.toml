[package]
name    = "deepmail-hashdb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "DeepMail service: gRPC hash registry with bloom filter and fuzzy clustering"

[[bin]]
name = "deepmail-hashdb"
path = "src/main.rs"

[dependencies]
deepmail-common = { path = "../deepmail-common" }

tokio.workspace              = true
tonic.workspace              = true
prost.workspace              = true
prost-types.workspace        = true
sqlx.workspace               = true
uuid.workspace               = true
chrono.workspace             = true
serde.workspace              = true
serde_json.workspace         = true
thiserror.workspace          = true
anyhow.workspace             = true
tracing.workspace            = true
tracing-subscriber.workspace = true
config.workspace             = true
redis.workspace              = true
futures.workspace            = true

# Fuzzy hashing (wraps libfuzzy via FFI — builds from bundled C source)
ssdeep = "0.7"
