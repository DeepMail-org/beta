syntax = "proto3";

package deepmail.hashdb;

import "google/protobuf/timestamp.proto";

service HashDbService {
  rpc CheckHash    (CheckHashRequest)    returns (CheckHashResponse);
  rpc RegisterHash (RegisterHashRequest) returns (RegisterHashResponse);
  rpc BulkCheck    (BulkCheckRequest)    returns (BulkCheckResponse);
}

enum FileVerdict {
  UNKNOWN    = 0;
  CLEAN      = 1;
  SUSPICIOUS = 2;
  MALICIOUS  = 3;
}

message CheckHashRequest {
  string sha256 = 1;
}

message CheckHashResponse {
  bool        found              = 1;
  FileVerdict verdict            = 2;
  float       verdict_confidence = 3;
  bool        analysis_required  = 4;
  string      malware_family     = 5;
  int32       seen_count         = 6;
  google.protobuf.Timestamp first_seen = 7;
}

message RegisterHashRequest {
  string      sha256             = 1;
  string      md5                = 2;
  string      sha1               = 3;
  string      ssdeep             = 4;
  string      tlsh               = 5;
  string      imphash            = 6;
  string      file_type          = 7;
  int64       file_size_bytes    = 8;
  FileVerdict verdict            = 9;
  float       verdict_confidence = 10;
  string      verdict_source     = 11;
  string      malware_family     = 12;
}

message RegisterHashResponse {
  bool   registered    = 1;
  bool   was_duplicate = 2;
  string hash_id       = 3;
}

message BulkCheckRequest {
  repeated string sha256_hashes = 1;
}

message BulkCheckResponse {
  repeated CheckHashResponse results = 1;
}
