syntax = "proto3";

package deepmail.billing;

service BillingService {
  rpc GetUsage         (GetUsageRequest)   returns (GetUsageResponse);
  rpc GenerateInvoice  (InvoiceRequest)    returns (InvoiceResponse);
  rpc GetInvoice       (GetInvoiceRequest) returns (InvoiceResponse);
}

message GetUsageRequest {
  string tenant_id      = 1;
  string billing_period = 2;
}

message GetUsageResponse {
  string tenant_id            = 1;
  string billing_period       = 2;
  int64  total_paise          = 3;
  int64  event_count          = 4;
  map<string, int64> cost_by_event_type = 5;
}

message InvoiceRequest {
  string tenant_id      = 1;
  string billing_period = 2;
}

message InvoiceResponse {
  string invoice_id     = 1;
  string tenant_id      = 2;
  string billing_period = 3;
  string razorpay_id    = 4;
  string status         = 5;
  int64  total_paise    = 6;
  string line_items     = 7;
  string issued_at      = 8;
  string paid_at        = 9;
  string due_at         = 10;
  string created_at     = 11;
  string updated_at     = 12;
}

message GetInvoiceRequest {
  string tenant_id      = 1;
  string billing_period = 2;
}
