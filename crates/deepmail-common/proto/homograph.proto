syntax = "proto3";

package deepmail.homograph;

service HomographDetector {
  rpc AnalyzeEmail(HomographAnalyzeRequest) returns (HomographAnalyzeResponse);
  rpc GetAnalysis(HomographGetRequest) returns (HomographAnalyzeResponse);
}

enum HomographRisk {
  RISK_NONE     = 0;
  RISK_LOW      = 1;
  RISK_MEDIUM   = 2;
  RISK_HIGH     = 3;
  RISK_CRITICAL = 4;
}

message HomographAnalyzeRequest {
  string email_id  = 1;
  string tenant_id = 2;
}

message HomographGetRequest {
  string email_id  = 1;
  string tenant_id = 2;
}

message HomographAnalyzeResponse {
  string email_id        = 1;
  int32 domains_checked  = 2;
  int32 high_risk_count  = 3;
  string overall_risk    = 4;
  string analysis_id     = 5;
  repeated DomainScore scores = 6;
}

message DomainScore {
  string        original_domain          = 1;
  string        decoded_unicode          = 2;
  string        skeleton                 = 3;
  string        best_brand_match         = 4;
  float         raw_similarity           = 5;
  float         final_score              = 6;
  uint32        edit_distance            = 7;
  bool          mixed_script             = 8;
  bool          punycode_abuse           = 9;
  HomographRisk risk_level               = 10;
}
