syntax = "proto3";

package deepmail.geo;

service GeoIntel {
  rpc ResolveIP       (IpRequest)       returns (GeoEnrichment);
  rpc ResolveHopChain (HopChainRequest) returns (HopChainResponse);
  rpc GetEmailGeo     (EmailGeoRequest) returns (EmailGeoResult);
}

message IpRequest {
  string ip_address = 1;
}

message GeoEnrichment {
  string ip_address          = 1;
  string country_code        = 2;
  string country_name        = 3;
  string region_name         = 4;
  string city                = 5;
  string postal_code         = 6;
  double latitude            = 7;
  double longitude           = 8;
  int32  accuracy_radius_km  = 9;
  string timezone            = 10;
  int32  asn_number          = 11;
  string asn_org             = 12;
  string isp                 = 13;
  string connection_type     = 14;
  bool   is_hosting          = 15;
  bool   is_residential      = 16;
  bool   is_datacenter       = 17;
  string reverse_dns         = 18;
  bool   ptr_match           = 19;
  float  confidence_score    = 20;
}

message HopChainRequest {
  string email_id              = 1;
  string tenant_id             = 2;
  repeated string hop_ips      = 3;
}

message HopChainResponse {
  repeated HopGeoDetail hops      = 1;
  float    anomaly_score          = 2;
  bool     routing_anomaly        = 3;
  repeated string anomaly_reasons = 4;
}

message HopGeoDetail {
  int32         hop_index      = 1;
  string        ip_address     = 2;
  GeoEnrichment geo            = 3;
  bool          anomaly_flag   = 4;
  string        anomaly_reason = 5;
}

message EmailGeoRequest {
  string email_id = 1;
}

message EmailGeoResult {
  string   email_id              = 1;
  repeated HopGeoDetail hops     = 2;
  string   true_sender_country   = 3;
  float    geo_anomaly_score     = 4;
  repeated GeoPoint map_points   = 5;
}

message GeoPoint {
  string ip       = 1;
  double lat      = 2;
  double lon      = 3;
  string label    = 4;
  string country  = 5;
  string asn_org  = 6;
}
