syntax = "proto3";

package deepmail.ioc;

service IocExtractor {
  rpc ExtractAndEnrich(IocExtractRequest) returns (IocExtractResponse);
  rpc GetEmailIocs(IocEmailRequest) returns (IocEmailResponse);
  rpc GetIocNode(IocNodeRequest) returns (IocNodeResponse);
  rpc GetCampaign(CampaignRequest) returns (CampaignResponse);
}

message IocExtractRequest {
  string email_id = 1;
  string tenant_id = 2;
}

message IocExtractResponse {
  string email_id = 1;
  int32 ioc_count = 2;
  int32 malicious_count = 3;
  string campaign_id = 4;
  string campaign_status = 5;
}

message IocEmailRequest {
  string email_id = 1;
  string tenant_id = 2;
}

message IocEmailResponse {
  repeated IocNodeProto iocs = 1;
}

message IocNodeRequest {
  string ioc_id = 1;
}

message IocNodeResponse {
  IocNodeProto node = 1;
}

message IocNodeProto {
  string id = 1;
  string ioc_type = 2;
  string ioc_value = 3;
  string threat_level = 4;
  float intel_score = 5;
  int32 sighting_count = 6;
}

message CampaignRequest {
  string campaign_id = 1;
}

message CampaignResponse {
  string campaign_id = 1;
  string name = 2;
  string status = 3;
  int32 member_count = 4;
  repeated string ioc_fingerprint = 5;
}
