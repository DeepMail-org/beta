syntax = "proto3";

package deepmail.report;

service ReportService {
  rpc GenerateReport(ReportRequest) returns (ReportResponse);
  rpc GetReport(GetReportRequest) returns (ReportResponse);
  rpc ScheduleDigest(DigestScheduleRequest) returns (DigestScheduleResponse);
}

message ReportRequest {
  string email_id = 1;
  string tenant_id = 2;
  bool force_regenerate = 3;
}

message ReportResponse {
  string report_id = 1;
  string email_id = 2;
  string json_s3_key = 3;
  string html_s3_key = 4;
  string status = 5;
  string final_verdict = 6;
  float final_score = 7;
}

message GetReportRequest {
  string email_id = 1;
  string tenant_id = 2;
  string format = 3;
}

message DigestScheduleRequest {
  string tenant_id = 1;
  string frequency = 2;
  repeated string recipient_emails = 3;
}

message DigestScheduleResponse {
  string schedule_id = 1;
  bool accepted = 2;
}
