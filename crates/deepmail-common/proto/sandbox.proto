syntax = "proto3";

package deepmail.sandbox;

import "google/protobuf/timestamp.proto";

service SandboxService {
  rpc SubmitUrl        (UrlSubmitRequest)  returns (SandboxJobAck);
  rpc SubmitFile       (FileSubmitRequest) returns (SandboxJobAck);
  rpc GetUrlReport     (GetReportRequest)  returns (UrlSandboxReport);
  rpc GetFileReport    (GetReportRequest)  returns (FileSandboxReport);
  rpc GetDynamicReport (GetReportRequest)  returns (DynamicSandboxReport);
}

enum SandboxVerdict {
  CLEAN      = 0;
  SUSPICIOUS = 1;
  MALICIOUS  = 2;
  ERROR      = 3;
  UNKNOWN    = 4;
}

enum JobStatus {
  QUEUED    = 0;
  RUNNING   = 1;
  COMPLETED = 2;
  FAILED    = 3;
  TIMEOUT   = 4;
}

message UrlSubmitRequest {
  string email_id          = 1;
  string tenant_id         = 2;
  string url               = 3;
  string extracted_url_id  = 4;
}

message FileSubmitRequest {
  string email_id      = 1;
  string tenant_id     = 2;
  string attachment_id = 3;
  string sha256        = 4;
  string s3_key        = 5;
  string content_type  = 6;
}

message SandboxJobAck {
  string    job_id = 1;
  JobStatus status = 2;
}

message GetReportRequest {
  string job_id = 1;
}

message UrlSandboxReport {
  string         job_id              = 1;
  string         email_id            = 2;
  SandboxVerdict verdict             = 3;
  string         final_url           = 4;
  int32          redirect_count      = 5;
  string         page_title          = 6;
  string         screenshot_s3_key   = 7;
  repeated string network_requests   = 8;
  repeated string dns_queries        = 9;
  repeated string downloaded_files   = 10;
  float          risk_score          = 11;
  google.protobuf.Timestamp completed_at = 12;
}

message FileSandboxReport {
  string         job_id              = 1;
  string         email_id            = 2;
  SandboxVerdict verdict             = 3;
  string         file_type           = 4;
  float          entropy             = 5;
  bool           high_entropy        = 6;
  bool           has_macros          = 7;
  bool           pdf_javascript      = 8;
  repeated string yara_matches       = 9;
  repeated string suspicious_strings = 10;
  string         imphash             = 11;
  float          risk_score          = 12;
  google.protobuf.Timestamp completed_at = 13;
}

message DynamicSandboxReport {
  string         job_id              = 1;
  string         email_id            = 2;
  SandboxVerdict verdict             = 3;
  string         malware_family      = 4;
  repeated string c2_servers         = 5;
  bool           process_injection   = 6;
  bool           persistence_attempt = 7;
  int32          syscall_count       = 8;
  repeated string mitre_techniques   = 9;
  string         cape_report_s3_key  = 10;
  float          risk_score          = 11;
  google.protobuf.Timestamp completed_at = 12;
}
