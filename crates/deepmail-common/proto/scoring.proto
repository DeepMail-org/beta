syntax = "proto3";
package scoring;

service ThreatScorer {
  rpc ComputeScore(ComputeScoreRequest) returns (ComputeScoreResponse);
  rpc GetScore(GetScoreRequest) returns (ComputeScoreResponse);
  rpc SubmitFeedback(FeedbackRequest) returns (FeedbackResponse);
}

message ComputeScoreRequest {
  string email_id = 1;
  string tenant_id = 2;
  bool force_recompute = 3;
}

message ComputeScoreResponse {
  string email_id = 1;
  float final_score = 2;
  string final_verdict = 3;
  int32 signals_available = 4;
  map<string, float> signal_scores = 5;
  bool is_final = 6;
}

message GetScoreRequest {
  string email_id = 1;
  string tenant_id = 2;
}

message FeedbackRequest {
  string email_id = 1;
  string tenant_id = 2;
  string analyst_id = 3;
  string correct_verdict = 4;
  string feedback_notes = 5;
}

message FeedbackResponse {
  string feedback_id = 1;
  bool accepted = 2;
}
