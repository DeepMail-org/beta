syntax = "proto3";
package deepmail.sandbox;

service SandboxUrlService {
  rpc AnalyzeUrl(UrlSandboxRequest) returns (UrlSandboxResponse);
}

service SandboxFileService {
  rpc AnalyzeFile(FileSandboxRequest) returns (FileSandboxResponse);
}

service SandboxDynamicService {
  rpc AnalyzeFile(DynamicSandboxRequest) returns (DynamicSandboxResponse);
}

// ── URL Sandbox (Playwright/gVisor) ──

message UrlSandboxRequest {
  string email_id = 1;
  string tenant_id = 2;
  string url = 3;
  int32 timeout_seconds = 4;
}

message UrlSandboxResponse {
  string email_id = 1;
  string url = 2;
  string final_url = 3;
  int32 redirect_count = 4;
  repeated string redirect_chain = 5;
  string dom_snapshot_s3_key = 6;
  string screenshot_s3_key = 7;
  repeated NetworkRequest network_requests = 8;
  repeated CookieHarvest cookies = 9;
  repeated string js_redirects = 10;
  float risk_score = 11;
  repeated string findings = 12;
}

message NetworkRequest {
  string method = 1;
  string url = 2;
  int32 status_code = 3;
  string content_type = 4;
  int64 size_bytes = 5;
  bool is_third_party = 6;
}

message CookieHarvest {
  string name = 1;
  string domain = 2;
  string path = 3;
  bool secure = 4;
  bool http_only = 5;
  string same_site = 6;
}

// ── File Sandbox (static analysis) ──

message FileSandboxRequest {
  string email_id = 1;
  string tenant_id = 2;
  string s3_key = 3;
  string filename = 4;
  string file_type = 5;
  string sha256 = 6;
}

message FileSandboxResponse {
  string email_id = 1;
  string sha256 = 2;
  float risk_score = 3;
  bool has_macros = 4;
  repeated string yara_matches = 5;
  repeated string ole_streams = 6;
  float entropy = 7;
  string imphash = 8;
  repeated ExifTag exif_tags = 9;
  repeated string suspicious_strings = 10;
  repeated string findings = 11;
}

message ExifTag {
  string tag = 1;
  string value = 2;
}

// ── Dynamic Sandbox (CAPEv2/Firecracker) ──

message DynamicSandboxRequest {
  string email_id = 1;
  string tenant_id = 2;
  string s3_key = 3;
  string filename = 4;
  string sha256 = 5;
  int32 timeout_seconds = 6;
}

message DynamicSandboxResponse {
  string email_id = 1;
  string sha256 = 2;
  float risk_score = 3;
  repeated SyscallTrace syscalls = 4;
  repeated NetworkCall network_calls = 5;
  repeated DroppedFile dropped_files = 6;
  repeated RegistryEdit registry_edits = 7;
  repeated ProcessInjection injections = 8;
  repeated PersistenceMechanism persistence = 9;
  repeated MitreMapping mitre_mappings = 10;
  C2Config c2_config = 11;
  repeated string findings = 12;
}

message SyscallTrace {
  string syscall_name = 1;
  repeated string arguments = 2;
  int64 timestamp_ns = 3;
  int32 pid = 4;
}

message NetworkCall {
  string protocol = 1;
  string destination_ip = 2;
  int32 destination_port = 3;
  string domain = 4;
  int64 bytes_sent = 5;
  int64 bytes_received = 6;
}

message DroppedFile {
  string path = 1;
  string sha256 = 2;
  int64 size_bytes = 3;
  string file_type = 4;
}

message RegistryEdit {
  string key = 1;
  string value_name = 2;
  string value_data = 3;
  string operation = 4; // create, modify, delete
}

message ProcessInjection {
  string technique = 1;
  int32 source_pid = 2;
  int32 target_pid = 3;
  string target_process = 4;
}

message PersistenceMechanism {
  string technique = 1;
  string location = 2;
  string detail = 3;
}

message MitreMapping {
  string tactic = 1;
  string technique_id = 2;
  string technique_name = 3;
  string subtechnique = 4;
  string evidence = 5;
}

message C2Config {
  bool detected = 1;
  string protocol = 2;
  repeated string c2_servers = 3;
  int32 beacon_interval_ms = 4;
  string encryption = 5;
  string raw_config = 6;
}
