syntax = "proto3";

package deepmail.graph;

service GraphService {
  rpc BuildEmailGraph (BuildGraphRequest) returns (BuildGraphResponse);
  rpc GetEmailGraph   (GetGraphRequest)   returns (GraphData);
  rpc FindC2Paths     (C2PathRequest)     returns (C2PathResponse);
}

message BuildGraphRequest {
  string   email_id          = 1;
  string   tenant_id         = 2;
  repeated GraphNode nodes   = 3;
  repeated GraphEdge edges   = 4;
}

message BuildGraphResponse {
  bool   success         = 1;
  int32  nodes_created   = 2;
  int32  edges_created   = 3;
  string error           = 4;
}

message GetGraphRequest {
  string email_id  = 1;
  string tenant_id = 2;
}

message GraphData {
  repeated GraphNode    nodes     = 1;
  repeated GraphEdge    edges     = 2;
  repeated CampaignInfo campaigns = 3;
}

message GraphNode {
  string id          = 1;
  string node_type   = 2;
  string label       = 3;
  float  risk_score  = 4;
  map<string, string> properties = 5;
}

message GraphEdge {
  string source_id    = 1;
  string target_id    = 2;
  string relationship = 3;
  float  weight       = 4;
  map<string, string> properties = 5;
}

message CampaignInfo {
  string campaign_id = 1;
  string name        = 2;
  float  confidence  = 3;
  int32  email_count = 4;
}

message C2PathRequest {
  string email_id = 1;
}

message C2PathResponse {
  repeated C2Path paths = 1;
}

message C2Path {
  repeated string hop_ips     = 1;
  float    confidence         = 2;
  string   malware_family     = 3;
  repeated string mitre_ttps  = 4;
}
