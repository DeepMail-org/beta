syntax = "proto3";
package deepmail.header;

service HeaderService {
  rpc AnalyzeHeaders(HeaderAnalysisRequest) returns (HeaderAnalysisResponse);
}

message HeaderAnalysisRequest {
  string email_id = 1;
  string tenant_id = 2;
  repeated EmailHeader headers = 3;
  string return_path = 4;
  string from_address = 5;
  string reply_to = 6;
  string message_id = 7;
  string x_mailer = 8;
  string date_header = 9;
}

message HeaderAnalysisResponse {
  string email_id = 1;
  SpfResult spf = 2;
  DkimSummaryResult dkim = 3;
  DmarcResult dmarc = 4;
  bool return_path_mismatch = 5;
  bool reply_to_mismatch = 6;
  bool message_id_fake = 7;
  XMailerInfo x_mailer_info = 8;
  TimeAnomalyResult time_anomaly = 9;
  float overall_header_score = 10;
  string summary = 11;
}

message EmailHeader {
  string name = 1;
  string value = 2;
}

message SpfResult {
  string result = 1; // pass, fail, softfail, neutral, none, temperror, permerror
  string domain = 2;
  string ip = 3;
  string detail = 4;
}

message DkimSummaryResult {
  string result = 1; // pass, fail, none
  string domain = 2;
  string selector = 3;
  string detail = 4;
}

message DmarcResult {
  string result = 1; // pass, fail, none
  string policy = 2; // none, quarantine, reject
  string domain = 3;
  bool alignment_spf = 4;
  bool alignment_dkim = 5;
  string detail = 6;
}

message XMailerInfo {
  string raw_value = 1;
  string client_name = 2;
  string client_version = 3;
  bool is_suspicious = 4;
  string detail = 5;
}

message TimeAnomalyResult {
  bool anomaly_detected = 1;
  int32 timezone_offset_minutes = 2;
  int32 delay_from_expected_seconds = 3;
  bool future_dated = 4;
  string detail = 5;
}
