syntax = "proto3";

package deepmail.intel;

service IntelEnricher {
  rpc EnrichIoc(EnrichIocRequest) returns (EnrichIocResponse);
  rpc EnrichBatch(EnrichBatchRequest) returns (EnrichBatchResponse);
  rpc GetCachedResult(GetCachedRequest) returns (EnrichIocResponse);
  rpc GetProviderStatus(ProviderStatusRequest) returns (ProviderStatusResponse);
}

message EnrichIocRequest {
  string ioc_value = 1;
  string ioc_type = 2;
  repeated string providers = 3;
  bool force_refresh = 4;
}

message EnrichIocResponse {
  string ioc_value = 1;
  string ioc_type = 2;
  map<string, string> provider_results_json = 3;
  float max_score = 4;
  bool is_malicious = 5;
  int64 cached_at = 6;
}

message EnrichBatchRequest {
  repeated EnrichIocRequest iocs = 1;
}

message EnrichBatchResponse {
  repeated EnrichIocResponse results = 1;
}

message GetCachedRequest {
  string ioc_value = 1;
  string ioc_type = 2;
  string provider = 3;
}

message ProviderStatusRequest {
  string provider = 1;
}

message ProviderStatusResponse {
  map<string, string> statuses = 1;
}
