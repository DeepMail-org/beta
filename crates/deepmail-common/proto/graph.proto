syntax = "proto3";

package deepmail.graph;

service GraphService {
  rpc SyncEmail(GraphSyncRequest) returns (GraphSyncResponse);
  rpc QueryRelated(GraphQueryRequest) returns (GraphQueryResponse);
  rpc FindC2Paths(C2PathRequest) returns (C2PathResponse);
  rpc FindShadowInfra(ShadowInfraRequest) returns (ShadowInfraResponse);
  rpc GetCampaignGraph(CampaignGraphRequest) returns (CampaignGraphResponse);
}

message GraphSyncRequest {
  string email_id = 1;
  string tenant_id = 2;
}

message GraphSyncResponse {
  string email_id = 1;
  int32 nodes_created = 2;
  int32 edges_created = 3;
  string status = 4;
}

message GraphQueryRequest {
  string ioc_value = 1;
  string ioc_type = 2;
  int32 depth = 3;
  string tenant_id = 4;
}

message GraphQueryResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
}

message GraphNode {
  string id = 1;
  string node_type = 2;
  string value = 3;
  float threat_score = 4;
  map<string, string> properties = 5;
}

message GraphEdge {
  string source_id = 1;
  string target_id = 2;
  string relation_type = 3;
  float confidence = 4;
}

message C2PathRequest {
  string email_id = 1;
  string tenant_id = 2;
}

message C2PathResponse {
  repeated GraphPath paths = 1;
}

message GraphPath {
  repeated GraphNode nodes = 1;
  string path_type = 2;
}

message ShadowInfraRequest {
  string ip_value = 1;
  string tenant_id = 2;
}

message ShadowInfraResponse {
  repeated GraphNode related_nodes = 1;
  string summary = 2;
}

message CampaignGraphRequest {
  string campaign_id = 1;
  string tenant_id = 2;
}

message CampaignGraphResponse {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
  int32 email_count = 3;
}
