syntax = "proto3";

package deepmail.notify;

service NotifyService {
  rpc SendAlert         (AlertRequest)    returns (AlertResponse);
  rpc BroadcastToTenant (TenantBroadcast) returns (AlertResponse);
}

enum AlertSeverity {
  INFO     = 0;
  LOW      = 1;
  MEDIUM   = 2;
  HIGH     = 3;
  CRITICAL = 4;
}

message AlertRequest {
  string        tenant_id = 1;
  string        email_id  = 2;
  AlertSeverity severity  = 3;
  string        title     = 4;
  string        body      = 5;
  map<string, string> metadata = 6;
}

message AlertResponse {
  bool     delivered          = 1;
  uint32   channels_notified  = 2;
  repeated string errors      = 3;
}

message TenantBroadcast {
  string        tenant_id    = 1;
  string        event_type   = 2;
  string        payload_json = 3;
  AlertSeverity severity     = 4;
}
